<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA GitHub Workflows</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 13px;
        margin: 0;
        width: 324px;
        background: #0d1117;
        color: #e6edf3;
        /* GitHub Primer dark tokens */
        --fg: #e6edf3;
        --fg-muted: #8b949e;
        --border: #30363d;
        --subtle: #161b22;
        --accent: #58a6ff;
        --success: #3fb950;
        --danger: #f85149;
        --btn-bg: #21262d;
        --btn-border: #30363d;
        --btn-hover: #30363d;
        --green: #238636;
        --green-hover: #2ea043;
        --canvas-inset: #0d1117;
        --header-bg: #161b22;
      }
      body[data-color-mode="light"] {
        background: #ffffff;
        color: #24292f;
        --fg: #24292f;
        --fg-muted: #57606a;
        --border: #d0d7de;
        --subtle: #f6f8fa;
        --accent: #0969da;
        --success: #1a7f37;
        --danger: #cf222e;
        --btn-bg: #f6f8fa;
        --btn-border: rgba(31, 35, 40, 0.15);
        --btn-hover: #f3f4f6;
        --green: #1f883d;
        --green-hover: #1a7f37;
        --header-bg: #ffffff;
      }

      header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--header-bg);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      header .logo {
        width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      }
      header .title-wrap { display: flex; flex-direction: column; gap: 1px; }
      header h1 { font-size: 13px; margin: 0; font-weight: 600; color: var(--fg); line-height: 1.2; }
      header .subtitle { font-size: 11px; color: var(--fg-muted); }

      .content { padding: 14px 16px; }

      /* Review mode toggle */
      .mode {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--subtle);
        margin-bottom: 12px;
      }
      .mode .dot { width: 8px; height: 8px; border-radius: 50%; background: #57534e; flex-shrink: 0; }
      .mode.on .dot { background: var(--success); box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
      .mode .mode-label { flex: 1; font-size: 12px; color: var(--fg-muted); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .mode .mode-label b { color: var(--fg); font-size: 13px; }
      .mode .mode-label .mode-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Primary action buttons */
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .btn {
        display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
        padding: 10px 12px; border: 1px solid var(--btn-border); border-radius: 8px;
        background: var(--btn-bg); color: var(--fg); font-size: 13px; font-weight: 600;
        cursor: pointer; text-align: left; transition: background .1s, border-color .1s;
      }
      .btn:hover { background: var(--btn-hover); }
      .btn:active { filter: brightness(.92); }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .btn:disabled:hover { background: var(--btn-bg); }
      .btn .btn-sub { font-size: 11px; font-weight: 400; color: var(--fg-muted); }

      /* Stats */
      .stats { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
      .stat { flex: 1; text-align: center; padding: 10px 4px; background: var(--subtle); }
      .stat + .stat { border-left: 1px solid var(--border); }
      .stat .num { font-size: 18px; font-weight: 700; color: var(--fg); line-height: 1.1; }
      .stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin-top: 3px; }

      /* Sectioned actions */
      .section-title {
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
        color: var(--fg-muted); margin: 0 0 8px;
      }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      .item {
        width: 100%; padding: 10px 12px; border: 1px solid var(--btn-border); border-radius: 8px;
        background: var(--btn-bg); color: var(--fg); font-size: 13px; font-weight: 500;
        cursor: pointer; text-align: left; transition: background .1s;
      }
      .item:hover { background: var(--btn-hover); }
      .item.primary { background: var(--green); border-color: rgba(27,31,36,.15); color: #fff; font-weight: 600; }
      .item.primary:hover { background: var(--green-hover); }

      .status { margin-top: 12px; font-size: 12px; color: var(--fg-muted); text-align: center; min-height: 15px; }
      .status.ok { color: var(--success); }
      .status.err { color: var(--danger); }

      footer { padding: 10px 16px 14px; border-top: 1px solid var(--border); margin-top: 14px; }
      a.settings {
        display: block; text-align: center; color: var(--accent);
        text-decoration: none; font-size: 12px; font-weight: 500;
      }
      a.settings:hover { text-decoration: underline; }

      .error-box { padding: 14px 16px; color: var(--danger); font-size: 12px; }
    </style>
  </head>
  <body data-color-mode="dark">
    <header>
      <img class="logo" src="icons/icon48.png" alt="" />
      <div class="title-wrap">
        <h1>AA GitHub Workflows</h1>
        <span class="subtitle">PR review toolkit</span>
      </div>
    </header>

    <div class="content" id="content">
      <div class="mode" id="mode-indicator">
        <span class="dot" id="mode-dot"></span>
        <span class="mode-label" id="mode-label"><b>Review mode off</b><span class="mode-hint">V / ⇧V disabled</span></span>
        <button class="item" id="toggle-mode" style="width:auto;padding:6px 12px;font-weight:600;">Turn on</button>
      </div>

      <div class="grid">
        <button class="btn" id="view-next">
          View next
          <span class="btn-sub">Mark file viewed</span>
        </button>
        <button class="btn" id="view-prev">
          Un-view last
          <span class="btn-sub">Undo viewed</span>
        </button>
      </div>

      <div class="stats">
        <div class="stat"><div class="num" id="total-files">–</div><div class="label">Files</div></div>
        <div class="stat"><div class="num" id="total-tests">–</div><div class="label">Tests</div></div>
        <div class="stat"><div class="num" id="unviewed-tests">–</div><div class="label">Unviewed</div></div>
      </div>

      <div class="section-title">Actions</div>
      <div class="stack">
        <button class="item primary" id="mark-all">Mark all files viewed</button>
        <button class="item" id="mark-tests">Mark all test files viewed</button>
        <button class="item" id="copy-feed">Copy PR feed entry</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <footer>
      <a class="settings" href="#" id="open-shortcuts">Keyboard shortcuts</a>
    </footer>

    <div class="error-box" id="error" style="display: none"></div>

    <script src="popup.js"></script>
  </body>
</html>
